<!DOCTYPE html>
<html>
<head>
    <title>Dasbor Banjir RnEST</title>
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 50px 20px;
        }
        h1 { color: #888888; font-size: 2.5rem; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px;}
        
        .wadah-kartu { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        
        .kartu { 
            background-color: #1a1a1a; 
            padding: 30px; 
            border-radius: 15px; 
            width: 250px; 
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .kartu h2 { font-size: 1.2rem; color: #aaaaaa; margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px;}
        .nilai { font-size: 4.5rem; font-weight: bold; margin: 15px 0; color: #00ff00; }
        .satuan { color: #777; font-size: 0.9rem; margin-bottom: 20px;}
        
        /* Kotak baru untuk kesimpulan status */
        .status { 
            font-size: 1.1rem; 
            font-weight: bold; 
            padding: 10px; 
            border-radius: 8px; 
            background-color: #222;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>Pemantauan Area Sungai</h1>
    
    <div class="wadah-kartu">
        <div class="kartu">
            <h2>Jarak Permukaan Air</h2>
            <div id="nilai-jarak" class="nilai">--</div>
            <div class="satuan">Centimeter (cm)</div>
            <div id="status-jarak" class="status">Memuat...</div>
        </div>

        <div class="kartu">
            <h2>Intensitas Hujan</h2>
            <div id="nilai-hujan" class="nilai">--</div>
            <div class="satuan">Analog Value (0-1023)</div>
            <div id="status-hujan" class="status">Memuat...</div>
        </div>

        <div class="kartu">
            <h2>Level Terendam</h2>
            <div id="nilai-air" class="nilai">--</div>
            <div class="satuan">Analog Value (0-1023)</div>
            <div id="status-air" class="status">Memuat...</div>
        </div>
    </div>

    <script>
        const urlFirebase = "https://rnest-flood-monitor-default-rtdb.asia-southeast1.firebasedatabase.app/data_sensor.json";

        async function ambilDataLengkap() {
            try {
                // Memanggil data tanpa menggunakan memori singgahan (cache)
                const respon = await fetch(urlFirebase, { cache: "no-store" });
                const data = await respon.json();
                
                if (data !== null) {
                    // 1. Tampilkan Angkanya
                    let jarak = data.jarak !== undefined ? data.jarak : 0;
                    let hujan = data.hujan !== undefined ? data.hujan : 0;
                    let air = data.air !== undefined ? data.air : 0;

                    document.getElementById("nilai-jarak").innerText = jarak;
                    document.getElementById("nilai-hujan").innerText = hujan;
                    document.getElementById("nilai-air").innerText = air;

                    // 2. Terjemahkan Kesimpulannya (Logika sesuai Arduino-mu)
                    
                    // --- Logika Sensor Ultrasonik ---
                    // Jarak di bawah 15 cm berarti air mendekati sensor (Debit Naik)
                    if (jarak > 0 && jarak < 15) {
                        document.getElementById("status-jarak").innerText = "DEBIT NAIK!";
                        document.getElementById("status-jarak").style.color = "#ff4444"; // Warna Merah
                    } else {
                        document.getElementById("status-jarak").innerText = "NORMAL";
                        document.getElementById("status-jarak").style.color = "#00ff00"; // Warna Hijau
                    }

                    // --- Logika Sensor Hujan ---
                    // Nilai analog kurang dari 800 menandakan banyak rintik air
                    if (hujan < 800) {
                        document.getElementById("status-hujan").innerText = "HUJAN TURUN!";
                        document.getElementById("status-hujan").style.color = "#ff4444";
                    } else {
                        document.getElementById("status-hujan").innerText = "TERANG / AMAN";
                        document.getElementById("status-hujan").style.color = "#00ff00";
                    }

                    // --- Logika Sensor Level Air ---
                    // Nilai analog lebih dari 300 berarti sensor terendam cukup dalam
                    if (air > 300) {
                        document.getElementById("status-air").innerText = "LEVEL BAHAYA!";
                        document.getElementById("status-air").style.color = "#ff4444";
                    } else {
                        document.getElementById("status-air").innerText = "AMAN";
                        document.getElementById("status-air").style.color = "#00ff00";
                    }
                }
            } catch (error) {
                console.log("Menunggu koneksi data...");
            }
        }

        setInterval(ambilDataLengkap, 1000);
        ambilDataLengkap();
    </script>
</body>
</html>
