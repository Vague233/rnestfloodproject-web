<!DOCTYPE html>
<html>
<head>
    <title>Dasbor Banjir RnEST Terpusat</title>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 30px 20px;}
        h1 { color: #888888; font-size: 2rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;}
        
        .blok-sungai { background-color: #111; border: 1px solid #333; border-radius: 15px; padding: 20px; margin-bottom: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);}
        .judul-sungai { color: #ffffff; font-size: 1.5rem; text-align: left; border-bottom: 2px solid #222; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px;}

        .wadah-kartu { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .kartu { background-color: #1a1a1a; padding: 20px; border-radius: 10px; width: 220px; border: 1px solid #222; display: flex; flex-direction: column; justify-content: space-between;}
        .kartu h2 { font-size: 1rem; color: #aaaaaa; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px;}
        .nilai { font-size: 3.5rem; font-weight: bold; margin: 10px 0; color: #555; transition: color 0.3s;}
        .satuan { color: #777; font-size: 0.8rem; margin-bottom: 15px;}
        .status { font-size: 1rem; font-weight: bold; padding: 8px; border-radius: 6px; background-color: #000; letter-spacing: 1px;}
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h1>Pemantauan Sungai Terpusat</h1>
    
    <!-- SUNGAI A -->
    <div class="blok-sungai">
        <h2 class="judul-sungai">SUNGAI A</h2>
        <div class="wadah-kartu">
            <div class="kartu">
                <h2>Jarak Air</h2>
                <div id="sungai_a-nilai-jarak" class="nilai">--</div>
                <div id="sungai_a-status-jarak" class="status">Offline</div>
            </div>
            <div class="kartu">
                <h2>Intensitas Hujan</h2>
                <div id="sungai_a-nilai-hujan" class="nilai">--</div>
                <div id="sungai_a-status-hujan" class="status">Offline</div>
            </div>
            <div class="kartu">
                <h2>Level Terendam</h2>
                <div id="sungai_a-nilai-air" class="nilai">--</div>
                <div id="sungai_a-status-air" class="status">Offline</div>
            </div>
        </div>
    </div>

    <!-- SUNGAI B -->
    <div class="blok-sungai">
        <h2 class="judul-sungai">SUNGAI B</h2>
        <div class="wadah-kartu">
            <div class="kartu">
                <h2>Jarak Air</h2>
                <div id="sungai_b-nilai-jarak" class="nilai">--</div>
                <div id="sungai_b-status-jarak" class="status">Offline</div>
            </div>
            <div class="kartu">
                <h2>Intensitas Hujan</h2>
                <div id="sungai_b-nilai-hujan" class="nilai">--</div>
                <div id="sungai_b-status-hujan" class="status">Offline</div>
            </div>
            <div class="kartu">
                <h2>Level Terendam</h2>
                <div id="sungai_b-nilai-air" class="nilai">--</div>
                <div id="sungai_b-status-air" class="status">Offline</div>
            </div>
        </div>
    </div>

    <!-- LOKASI SUNGAI C -->
    <div class="blok-sungai">
        <h2 class="judul-sungai">SUNGAI C</h2>
        <div class="wadah-kartu">
            <div class="kartu">
                <h2>Jarak Air</h2>
                <div id="sungai_c-nilai-jarak" class="nilai">--</div>
                <div id="sungai_c-status-jarak" class="status">Offline</div>
            </div>
            <div class="kartu">
                <h2>Intensitas Hujan</h2>
                <div id="sungai_c-nilai-hujan" class="nilai">--</div>
                <div id="sungai_c-status-hujan" class="status">Offline</div>
            </div>
            <div class="kartu">
                <h2>Level Terendam</h2>
                <div id="sungai_c-nilai-air" class="nilai">--</div>
                <div id="sungai_c-status-air" class="status">Offline</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiBPKW-LcVVt9H4p4xX0OZ5zsBj_BN_Ho",
            authDomain: "rnest-flood-monitor.firebaseapp.com",
            databaseURL: "https://rnest-flood-monitor-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rnest-flood-monitor",
            storageBucket: "rnest-flood-monitor.firebasestorage.app",
            messagingSenderId: "274900869885",
            appId: "1:274900869885:web:84ae9959669e9bd116d494"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        const laciPusat = database.ref('lokasi_sungai');

        function perbaruiLayarSungai(idKodeSungai, data) {
            document.getElementById(`${idKodeSungai}-nilai-jarak`).innerText = data.jarak;
            document.getElementById(`${idKodeSungai}-nilai-hujan`).innerText = data.hujan;
            document.getElementById(`${idKodeSungai}-nilai-air`).innerText = data.air;

            if (data.jarak > 0 && data.jarak < 10) {
                document.getElementById(`${idKodeSungai}-status-jarak`).innerText = "DEBIT NAIK!";
                document.getElementById(`${idKodeSungai}-status-jarak`).style.color = "#ff4444";
                document.getElementById(`${idKodeSungai}-nilai-jarak`).style.color = "#ff4444";
            } else {
                document.getElementById(`${idKodeSungai}-status-jarak`).innerText = "NORMAL";
                document.getElementById(`${idKodeSungai}-status-jarak`).style.color = "#00ff00";
                document.getElementById(`${idKodeSungai}-nilai-jarak`).style.color = "#00ff00";
            }

            if (data.hujan < 800) {
                document.getElementById(`${idKodeSungai}-status-hujan`).innerText = "HUJAN TURUN!";
                document.getElementById(`${idKodeSungai}-status-hujan`).style.color = "#ff4444";
                document.getElementById(`${idKodeSungai}-nilai-hujan`).style.color = "#ff4444";
            } else {
                document.getElementById(`${idKodeSungai}-status-hujan`).innerText = "TERANG / AMAN";
                document.getElementById(`${idKodeSungai}-status-hujan`).style.color = "#00ff00";
                document.getElementById(`${idKodeSungai}-nilai-hujan`).style.color = "#00ff00";
            }

            if (data.air > 300) {
                document.getElementById(`${idKodeSungai}-status-air`).innerText = "LEVEL BAHAYA!";
                document.getElementById(`${idKodeSungai}-status-air`).style.color = "#ff4444";
                document.getElementById(`${idKodeSungai}-nilai-air`).style.color = "#ff4444";
            } else {
                document.getElementById(`${idKodeSungai}-status-air`).innerText = "AMAN";
                document.getElementById(`${idKodeSungai}-status-air`).style.color = "#00ff00";
                document.getElementById(`${idKodeSungai}-nilai-air`).style.color = "#00ff00";
            }
        }

        laciPusat.on('value', (snapshot) => {
            const semuaData = snapshot.val();
            
            if (semuaData !== null) {
                if (semuaData.sungai_a) perbaruiLayarSungai("sungai_a", semuaData.sungai_a);
                if (semuaData.sungai_b) perbaruiLayarSungai("sungai_b", semuaData.sungai_b);
                if (semuaData.sungai_c) perbaruiLayarSungai("sungai_c", semuaData.sungai_c);
            }
        });
    </script>
</body>
</html>
